name: Import appendix files

on:
  push:
    paths:
      - '.github/workflows/import-appendix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-appendix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser and PDF tools
        run: |
          python -m pip install --upgrade pip
          pip install playwright pymupdf
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y libreoffice

      - name: Download, sanitize, and prepare appendix files
        run: python scripts/import_appendix_from_firestorage.py

      - name: Commit appendix materials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appendix/
          if git diff --cached --quiet; then
            echo "No appendix changes to commit."
          else
            git commit -m "Add permanent appendix materials for browser viewing"
            git push
          fi

name: Diagnose firestorage share

on:
  push:
    paths:
      - '.github/workflows/diagnose-firestorage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect one share page
        run: |
          python - <<'PY'
          import re, urllib.request
          url='https://firestorage.ai/ja/f/KjPqP1eqEl_e'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=30) as r:
              data=r.read().decode('utf-8','replace')
              print('STATUS',r.status)
              print('FINAL',r.geturl())
              print('CONTENT-TYPE',r.headers.get('content-type'))
              print('LENGTH',len(data))
              print('--- LINKS ---')
              for m in re.finditer(r'<a[^>]+href=[\"\']([^\"\']+)[\"\'][^>]*>(.*?)</a>',data,re.I|re.S):
                  text=re.sub('<[^>]+>',' ',m.group(2))
                  text=re.sub(r'\s+',' ',text).strip()
                  print(text[:120],'=>',m.group(1))
              print('--- HTML SAMPLE ---')
              print(data[:30000])
          PY

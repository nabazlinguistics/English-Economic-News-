name: Apply website design update

on:
  push:
    paths:
      - '.github/workflows/apply-design-update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Download assets and update website
        run: python scripts/apply-design-update.py

      - name: Commit website update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/university-of-raparin-logo.png appendix/sketch-engine-antconc-similar-results.pdf index.html styles.css
          if git diff --cached --quiet; then
            echo "No website changes to commit."
          else
            git commit -m "Add Raparin branding and Sketch Engine AntConc comparison"
            git pull --rebase origin main
            git push origin main
          fi

name: Apply identity card backgrounds

on:
  push:
    paths:
      - '.github/workflows/apply-identity-backgrounds.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Apply campus backgrounds
        run: python scripts/apply-identity-backgrounds.py

      - name: Commit website update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/researcher-ranya-campus.png assets/supervisor-qaladze-campus.png index.html styles.css
          if git diff --cached --quiet; then
            echo "No website changes to commit."
          else
            git commit -m "Add Ranya and Qaladze backgrounds to identity cards"
            git pull --rebase origin main
            git push origin main
          fi
